name: publish-crates

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      # malt-parser and tltk-core are published — the reusable library crates.
      # The verifier/worker/web crates are application/tooling and stay
      # repo-only. Order matters: a published tltk-core resolves its
      # malt-parser dependency from the registry, so malt-parser must be
      # published and visible in the sparse index first.
      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # manifest truth, not the lockfile: cargo pkgid reads the lock, and
          # a lock lagging the manifest bump reads as "already published"
          # (that is how v0.1.2 concluded green with malt-parser skipped)
          MP_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="malt-parser"))')
          if curl -sf -A "tltk-rs-release (GitHub Actions)" \
              "https://crates.io/api/v1/crates/malt-parser/$MP_VERSION" \
              | grep -q "\"num\":\"$MP_VERSION\""; then
            echo "malt-parser $MP_VERSION already published — skipping"
          else
            cargo publish -p malt-parser
          fi

          # The sparse index can lag a fresh publish by a few seconds; wait
          # for the version to resolve before tltk-core packages against it.
          for _ in $(seq 1 24); do
            if curl -sf "https://index.crates.io/ma/lt/malt-parser" \
                | grep -q "\"vers\":\"$MP_VERSION\""; then
              break
            fi
            sleep 5
          done

          cargo publish -p tltk-core
