name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Path triage for the skip matrix below. Safe defaults: weird pushes
    # (first push, force push) and workflow_dispatch count as "everything";
    # only docs-only diffs skip the whole loop.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.triage.outputs.rust }}
      tooling: ${{ steps.triage.outputs.tooling }}
      web_functional: ${{ steps.triage.outputs.web_functional }}
      ship: ${{ steps.triage.outputs.ship }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: triage
        run: |
          set -euo pipefail
          all_true() { echo "rust=true" >> "$GITHUB_OUTPUT"; echo "tooling=true" >> "$GITHUB_OUTPUT"; echo "web_functional=true" >> "$GITHUB_OUTPUT"; echo "ship=true" >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then all_true; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            before="${{ github.event.before }}"
            # A displaced sha (force push) is not in this shallow-ish history:
            # treat it as "everything changed" instead of dying on the diff.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              all_true; exit 0
            fi
            files=$(git diff --name-only "$before" "${{ github.sha }}")
          fi
          rust=false; tooling=false; web_functional=false; ship=false
          echo "$files" | grep -qE '^(crates/|Cargo\.toml$|Cargo\.lock$|corpus/|golden/)' && rust=true || true
          echo "$files" | grep -qE '^(scripts/|tools/|\.github/workflows/)' && tooling=true || true
          echo "$files" | grep -qE '^(web/js/|web/index\.html$|web/e2e/|web/sw\.js$)' && web_functional=true || true
          # ship = anything except docs-only diffs (unknown paths ship — safe default)
          [ -z "$(echo "$files" | grep -vE '^(docs/|\.scratch/|AGENTS\.md$|CLAUDE\.md$|README\.md$|LICENSE$|THIRD_PARTY_LICENSES\.md$|PORTING-GAPS\.md$|\.gitignore$)' )" ] || ship=true
          {
            echo "rust=$rust"; echo "tooling=$tooling"
            echo "web_functional=$web_functional"; echo "ship=$ship"
          } >> "$GITHUB_OUTPUT"

  gate:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust 1.99.1 / python 3.12 / node 24 LTS)
        uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
      - name: Cache uv (PEP 723 script envs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('tools/**') }}

      - name: Add wasm targets + clippy + wasm-bindgen CLI
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          rustup component add clippy
          cargo install wasm-bindgen-cli --locked --version 0.2.129

      - name: Fetch gitignored model blobs (edu/w2v) from the tltk wheel
        run: mise run fetch-models

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (incl. SIMD bit-exactness + oracle tests)
        run: cargo test --workspace

      - name: Script lint+format (ruff, mise-pinned) + bash/node syntax + exec-bit + bundled-license audits
        run: |
          ruff --version
          ruff check scripts
          ruff format --check scripts
          python3 scripts/check_exec_bits.py
          python3 scripts/check_bundled_licenses.py
          for f in scripts/*.sh; do bash -n "$f"; done
          for f in scripts/*.mjs; do node --check "$f"; done

      - name: Parity — baselines + per-function goldens (scripts/parity_fn.sh)
        run: bash scripts/parity_fn.sh

      - name: wasm arms compile (simd128 on/off)
        run: |
          cargo check -p tltk-worker --target wasm32-unknown-unknown
          RUSTFLAGS="-C target-feature=+simd128" cargo check -p tltk-worker --target wasm32-unknown-unknown

      - name: Web build + node parity (both flavors)
        run: |
          mise run build-web
          mise run node-parity

      - name: wasm32-WASI parity lane (wasmtime; auto-downloads)
        run: mise run wasm-parity

  web-e2e:
    needs: [changes]
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.tooling == 'true' ||
      needs.changes.outputs.web_functional == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust 1.99.1 / node 24 LTS)
        uses: jdx/mise-action@v2

      - name: Cache uv (PEP 723 script envs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('tools/**') }}

      - name: Add wasm target + wasm-bindgen CLI
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --locked --version 0.2.129

      - name: Fetch gitignored model blobs (edu/w2v) from the tltk wheel
        run: mise run fetch-models

      - name: Build web engine (wasm, both flavors)
        run: mise run build-web

      - name: Module-syntax gate (the "no options" incident — browser parses these as ES modules)
        run: |
          set -e
          for f in web/js/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs
          done
          echo "module syntax OK"

      - name: Install pinned playwright + chromium
        run: |
          cd web/e2e && npm install --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: E2E loop — every function in a real browser
        run: node scripts/web_e2e.mjs --timeout 180000

      # Hand the deploy job the exact bytes this green loop just verified —
      # deterministic build, so deploy never rebuilds or re-fetches.
      - name: Stage model data for static serving
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          rm -rf web/data && mkdir -p web/data
          cp crates/tltk-core/data/*.bin.gz web/data/
          cp crates/tltk-core/data/sylrule.txt crates/tltk-core/data/thaisyl.txt web/data/
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: site-build
          path: |
            web/wasm
            web/data
          retention-days: 3

  deploy:
    # The production deploy, gated on the same commit's ci being green —
    # GitHub holds this job until gate + web-e2e pass for this exact sha.
    # Replaces the old parallel deploy-cloudflare.yml, which raced ci and
    # shipped a build from a red commit (observed on fb771dd: ci failure,
    # deploy success). Manual redeploy: gh workflow run ci.yml.
    needs: [changes, gate, web-e2e]
    if: >-
      always() &&
      needs.changes.outputs.ship == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: production
    # Not the workflow's ci-${{ github.ref }} group: a newer push cancels THIS
    # workflow's pending run, but a deploy already in flight gets its own
    # group and finishes (the newer run deploys again after it).
    concurrency:
      group: deploy-toolbox
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Green web-e2e hands over the exact wasm+data bytes it verified
      # (deterministic build) — no rebuild, no re-fetch. On skip lanes
      # (css/static/docs-only) nothing was verified, so the deploy rebuilds
      # everything itself instead of shipping unverified bytes quietly.
      - name: Download the e2e-verified build
        if: needs.web-e2e.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: web

      - name: Rebuild path (web-e2e skipped — css/static/docs-only push)
        if: needs.web-e2e.result != 'success'
        run: |
          echo "web-e2e did not run for this diff; the deploy builds and self-checks the site."

      - name: Install pinned toolchain
        if: needs.web-e2e.result != 'success'
        uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        if: needs.web-e2e.result != 'success'
      - name: Cache uv (PEP 723 script envs)
        if: needs.web-e2e.result != 'success'
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('tools/**') }}

      - name: Add wasm targets + wasm-bindgen CLI
        if: needs.web-e2e.result != 'success'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --locked --version 0.2.129

      - name: Fetch model blobs (edu/w2v/malt)
        if: needs.web-e2e.result != 'success'
        run: mise run fetch-models

      - name: Build web artifacts (scalar + simd128)
        if: needs.web-e2e.result != 'success'
        run: mise run build-web

      - name: Stage model data for static serving
        if: needs.web-e2e.result != 'success'
        run: |
          # web/data is a symlink to crates/tltk-core/data in the repo (local
          # serve convenience) — replace with real copies for the asset upload.
          rm -rf web/data && mkdir -p web/data
          cp crates/tltk-core/data/*.bin.gz web/data/
          cp crates/tltk-core/data/sylrule.txt crates/tltk-core/data/thaisyl.txt web/data/

      # Direct CLI (wrangler-action + mise's npx shim prompts in CI and dies);
      # npx -y answers the install prompt, wrangler reads the CF_* env vars.
      - name: Module-syntax gate (the browser parses web/js as ES modules — 2026-10-17 "no options" incident)
        run: |
          set -e
          for f in web/js/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs
          done
          echo "module syntax OK"

      - name: Deploy static toolbox to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy --config web/wrangler.jsonc
