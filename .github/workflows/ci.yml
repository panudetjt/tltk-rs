name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust 1.99.1 / python 3.12 / node 24 LTS)
        uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
      - name: Cache uv (PEP 723 script envs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('tools/**') }}

      - name: Add wasm targets + clippy + wasm-bindgen CLI
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          rustup component add clippy
          cargo install wasm-bindgen-cli --locked --version 0.2.129

      - name: Fetch gitignored model blobs (edu/w2v) from the tltk wheel
        run: mise run fetch-models

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (incl. SIMD bit-exactness + oracle tests)
        run: cargo test --workspace

      - name: Parity — stichula goldens (baseline 241/3/0)
        run: |
          out=$(cargo run -q -p tltk-verifier -- check corpus/corpus.jsonl golden/stichula.jsonl crates/tltk-core/data || true)
          echo "$out"; echo "$out" | grep -q "pass=241 fail=3 missing_golden=0"

      - name: Parity — local python goldens (baseline 228/7/9)
        run: |
          out=$(cargo run -q -p tltk-verifier -- check corpus/corpus.jsonl golden/local_python.jsonl crates/tltk-core/data || true)
          echo "$out"; echo "$out" | grep -q "pass=228 fail=7 missing_golden=9" 

      - name: Parity — extra oracle goldens (fail=0 required; grows as new functions gain oracle goldens)
        run: |
          out=$(cargo run -q -p tltk-verifier -- check corpus/corpus_extra.jsonl golden/local_python_extra.jsonl crates/tltk-core/data)
          echo "$out"
          echo "$out" | grep -q "fail=0 missing_golden=0"

      - name: Parity — per-function oracle goldens (corpus_fn_*; fail=0 required)
        run: |
          for c in corpus/corpus_fn_*.jsonl; do
            g="golden/local_python_fn_${c##*corpus_fn_}"
            out=$(cargo run -q -p tltk-verifier -- check "$c" "$g" crates/tltk-core/data)
            echo "$out"
            # corpus_fn_plots is disclosed-diff by design (hand-rolled renderer
            # ≠ matplotlib bytes): every row must fail on PNG bytes, none missing.
            n=$(wc -l < "$c")
            if [ "${c##*/}" = "corpus_fn_plots.jsonl" ]; then
              echo "$out" | grep -q "pass=0 fail=$n missing_golden=0"
            else
              echo "$out" | grep -q "fail=0 missing_golden=0"
            fi
          done

      - name: wasm arms compile (simd128 on/off)
        run: |
          cargo check -p tltk-worker --target wasm32-unknown-unknown
          RUSTFLAGS="-C target-feature=+simd128" cargo check -p tltk-worker --target wasm32-unknown-unknown

      - name: Web build + node parity (both flavors)
        run: |
          mise run build-web
          mise run node-parity

      - name: wasm32-WASI parity lane (wasmtime; auto-downloads)
        run: mise run wasm-parity
