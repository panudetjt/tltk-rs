name: deploy-cloudflare

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-toolbox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
      - name: Cache uv (PEP 723 script envs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('tools/**') }}

      - name: Add wasm targets + wasm-bindgen CLI
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --locked --version 0.2.129

      - name: Fetch model blobs (edu/w2v)
        run: mise run fetch-models

      - name: Build web artifacts (scalar + simd128)
        run: mise run build-web

      - name: Stage model data for static serving
        run: |
          # web/data is a symlink to crates/tltk-core/data in the repo (local
          # serve convenience) — replace with real copies for the asset upload.
          rm -rf web/data && mkdir -p web/data
          cp crates/tltk-core/data/*.bin.gz web/data/
          cp crates/tltk-core/data/sylrule.txt crates/tltk-core/data/thaisyl.txt web/data/
          ls -la web/data/

      # A deploy that fails parity is not a deploy.
      - name: Parity gate on the shipped wasm (simd flavor)
        run: |
          node scripts/node_parity.mjs --wasm-dir web/wasm/simd --corpus corpus/corpus_extra.jsonl --golden golden/local_python_extra.jsonl
          out=$(node scripts/node_parity.mjs --wasm-dir web/wasm/simd --corpus corpus/corpus.jsonl --golden golden/stichula.jsonl --expect-fails 3 || true)
          echo "$out"; echo "$out" | grep -q "pass=241 fail=3 missing=0"

      # Direct CLI (wrangler-action + mise's npx shim prompts in CI and dies);
      # npx -y answers the install prompt, wrangler reads the CF_* env vars.
      - name: Module-syntax gate (the browser parses web/js as ES modules — 2026-10-17 "no options" incident)
        run: |
          set -e
          for f in web/js/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs
          done
          echo "module syntax OK"

      - name: Browser load gate (page alive, dropdown matches app.js)
        run: |
          cd web/e2e && npm install --no-fund --no-audit --silent
          npx playwright install --with-deps chromium
          cd ../..
          node scripts/web_e2e.mjs --load-only --timeout 120000

      - name: Deploy static toolbox to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy --config web/wrangler.jsonc
