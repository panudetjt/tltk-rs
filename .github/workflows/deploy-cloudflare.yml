name: deploy-cloudflare

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-toolbox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
      - name: Cache uv (PEP 723 script envs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('tools/**') }}

      - name: Add wasm targets
        run: rustup target add wasm32-unknown-unknown

      - name: Fetch model blobs (edu/w2v)
        run: mise run fetch-models

      - name: Build web artifacts (scalar + simd128)
        run: mise run build-web

      - name: Stage model data for static serving
        run: |
          mkdir -p web/data
          cp crates/tltk-core/data/*.bin.gz web/data/
          cp crates/tltk-core/data/sylrule.txt web/data/
          cp crates/tltk-core/data/thaisyl.txt web/data/
          ls -la web/data/

      # A deploy that fails parity is not a deploy.
      - name: Parity gate on the shipped wasm (simd flavor)
        run: |
          node scripts/node_parity.mjs --wasm-dir web/wasm/simd --corpus corpus/corpus_extra.jsonl --golden golden/local_python_extra.jsonl
          out=$(node scripts/node_parity.mjs --wasm-dir web/wasm/simd --corpus corpus/corpus.jsonl --golden golden/stichula.jsonl)
          echo "$out"; echo "$out" | grep -q "pass=241 fail=3 missing=0"

      - name: Deploy static toolbox to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4"
          command: deploy --config wrangler-toolbox.toml
