[package]
name = "malt-parser"
description = "JVM-free Rust port of MaltParser 1.9.2's inference engine (arc-eager + MCSVM) — bit-exact parsing from a precompiled malt.bin blob"
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
