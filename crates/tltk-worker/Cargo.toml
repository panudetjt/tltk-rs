[package]
name = "tltk-worker"
description = "Cloudflare Worker serving the tltk-core API (mirrors the stichula /process endpoint)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"
tltk-core = { path = "../tltk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
