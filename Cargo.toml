[workspace]
resolver = "2"
members = [
    "crates/tltk-core",
    "crates/tltk-worker",
    "crates/tltk-verifier",
    "crates/tltk-web",
    "crates/malt-parser",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/panudetjt/tltk-rs"

[profile.release]
opt-level = "s"
lto = true
# NOTE: no `strip = true` here — stripping the wasm drops the externref table
# and wasm-bindgen's catch wrappers fail ("externref table required").
