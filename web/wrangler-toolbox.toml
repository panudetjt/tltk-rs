# web/wrangler-toolbox.toml
# Cloudflare static-only deployment configuration for the TLTK Web Toolbox.
# Deploys as pure static assets (no worker script or serverless backend needed).

name = "tltk-toolbox"
compatibility_date = "2026-10-16"

# Deploy directory containing index.html, css/, js/, wasm/, and data/
[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
